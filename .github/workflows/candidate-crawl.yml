name: SAFE Action Candidate Crawl

# Refreshes data/seats.json (candidates + incumbents) via the Tier-1
# (CI-safe, API-only) candidate pipeline. The heavy Ballotpedia / web-search
# scrapers are NOT run here (hours-long + fragile) — run those locally with
# `python crawler/run_candidate_pipeline.py --full`.
#
# Relies on data/legislators.json being fresh, which the daily Intelligence
# Crawl commits to the repo. Weekly is enough; candidate data moves slowly.

on:
  schedule:
    - cron: '0 10 * * 1'   # Mondays 10:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  candidate-crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install crawler dependencies
        run: |
          cd crawler
          pip install -e .

      - name: Run Tier-1 candidate pipeline
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
          OPENSTATES_API_KEY: ${{ secrets.OPENSTATES_API_KEY }}
        run: python crawler/run_candidate_pipeline.py --tier1

      - name: Commit refreshed seats.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seats.json
          git diff --staged --quiet || git commit -m "chore: refresh candidate data (tier1) [skip ci]"
          git push

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: firebase-adminsdk-fbsvc@safe-action-website.iam.gserviceaccount.com

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy refreshed data to Firebase Hosting
        run: firebase deploy --only hosting --project safe-action-website
