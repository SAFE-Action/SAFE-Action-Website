name: Debug Function Logs

on:
  workflow_dispatch:
    inputs:
      fn:
        description: 'Function/service name'
        required: false
        default: 'pledges'
      minutes:
        description: 'Look back this many minutes'
        required: false
        default: '120'

jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: firebase-adminsdk-fbsvc@safe-action-website.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: safe-action-website

      - name: Read recent function logs
        run: |
          FRESH=$(date -u -d "${{ inputs.minutes }} minutes ago" +%Y-%m-%dT%H:%M:%SZ)
          gcloud logging read \
            "resource.type=cloud_run_revision AND resource.labels.service_name=${{ inputs.fn }} AND timestamp>=\"$FRESH\"" \
            --project safe-action-website --limit 100 \
            --format 'value(timestamp, severity, textPayload)' || true
